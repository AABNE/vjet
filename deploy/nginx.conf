# vJetstar Pilot Hub — Nginx config
# Place at: /etc/nginx/conf.d/vjetstar.conf
# Replace YOUR_DOMAIN_OR_IP with your actual domain/IP

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # Redirect HTTP → HTTPS once you have SSL cert
    # return 301 https://$host$request_uri;

    # Static frontend files
    root /opt/vjetstar/artifacts/flight-timetable/dist/public;
    index index.html;

    # API proxy → Express backend
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
        proxy_read_timeout 60s;
    }

    # SPA fallback — all non-API, non-asset routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}

