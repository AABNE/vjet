# vJetstar Pilot Hub — Nginx site config
# ─────────────────────────────────────────────────────────────────────────
# This file slots ALONGSIDE your existing nginx config without touching it.
#
# SETUP:
#   sudo cp deploy/nginx-vjetstar.conf /etc/nginx/sites-available/vjetstar
#   sudo ln -s /etc/nginx/sites-available/vjetstar /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Then optionally add SSL:
#   sudo certbot --nginx -d pilots.yourdomain.com
#
# If you don't have a domain, replace server_name with your VPS public IP
# and remove the SSL section.
# ─────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    # ↓ Replace with your domain OR your VPS public IP
    server_name pilots.yourdomain.com YOUR_VPS_IP;

    # ── Static frontend (Vite build output) ──────────────────────────────
    root /opt/vjetstar/artifacts/flight-timetable/dist/public;
    index index.html;

    # ── API — proxy to Express on port 3000 ──────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ── SPA fallback — everything else → index.html ───────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static file caching ───────────────────────────────────────────────
    location ~* \.(js|css|png|svg|ico|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Compression ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
}

# ── HTTPS (certbot will fill this in automatically) ───────────────────────
# After running: sudo certbot --nginx -d pilots.yourdomain.com
# certbot adds the SSL server block here automatically.
